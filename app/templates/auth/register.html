{% extends "base.html" %}

{% block title %}Đăng ký tài khoản{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-header bg-white py-3">
          <h4 class="card-title mb-0 text-center"><i class="bi bi-person-plus me-2 text-primary"></i>Đăng ký tài khoản</h4>
        </div>
        <div class="card-body p-4">
          <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="mb-3">
              <label for="username" class="form-label">Tên đăng nhập</label>
              <input type="text" class="form-control" id="username" name="username" value="{{ username or '' }}" required autofocus placeholder="Ví dụ: student_c">
              <div class="form-text">Từ 3-30 ký tự (chữ cái, số và dấu gạch dưới).</div>
            </div>

            <div class="mb-3">
              <label for="role" class="form-label">Vai trò</label>
              <select class="form-select" id="role" name="role">
                <option value="student" {% if not role or role == 'student' %}selected{% endif %}>Sinh viên (Student)</option>
                <option value="admin" {% if role == 'admin' %}selected{% endif %}>Quản trị viên (Admin)</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">Mật khẩu</label>
              <input type="password" class="form-control" id="password" name="password" required placeholder="Tối thiểu 6 ký tự">
            </div>

            <div class="mb-3">
              <label for="confirm_password" class="form-label">Xác nhận mật khẩu</label>
              <input type="password" class="form-control" id="confirm_password" name="confirm_password" required placeholder="Nhập lại mật khẩu">
            </div>

            <div class="d-grid gap-2 mt-4">
              <button type="submit" class="btn btn-primary"><i class="bi bi-person-check me-1"></i>Tạo tài khoản</button>
            </div>
          </form>

          <hr class="my-4">
          <p class="text-center mb-0 small">
            Đã có tài khoản? <a href="{{ url_for('auth.login') }}">Đăng nhập tại đây</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
